events { worker_connections 1024; }

http {
  server_tokens off;
  client_max_body_size 1m;

  server {
    listen 80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 308 https://$host:61528$request_uri; }
  }

  server {
    listen 443 ssl;
    server_name 47.79.38.134;
    ssl_certificate /etc/letsencrypt/live/47.79.38.134/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/47.79.38.134/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    location / {
      proxy_pass http://nexus-quant:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host:$server_port;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 90s;
    }
  }
}
